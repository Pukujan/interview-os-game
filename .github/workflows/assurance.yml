name: assurance

on:
  push:
    branches: [main, pam-v0.2-reprojectization]
  pull_request:

jobs:
  pam-projectization:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Interview OS
        uses: actions/checkout@v4

      - name: Checkout pinned Project Assurance Modules
        uses: actions/checkout@v4
        with:
          repository: Pukujan/project-assurance-modules
          ref: 03fc55ae4036a9704cdb929fb3ae6dc520ae2183
          path: pam

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned PAM validation environment
        run: python -m pip install -e './pam[dev]'

      - name: Run PAM structured-handoff positive and negative tests
        env:
          PYTHONPATH: pam
        run: python -m pytest pam/tests/test_pam_handoff.py

      - name: Run PAM build-vs-reuse adversarial tests
        env:
          PYTHONPATH: pam
        run: python -m pytest pam/tests/test_pam_reuse.py

      - name: Validate Interview OS reuse assessment
        env:
          PYTHONPATH: pam
        run: python -m scripts.pam_reuse assurance/REUSE_ASSESSMENT.json

      - name: Validate Project Assurance manifest
        env:
          PYTHONPATH: pam
        run: python -m scripts.pam_validate PROJECT_ASSURANCE.json

      - name: Validate Interview OS structured handoff
        env:
          PYTHONPATH: pam
        run: python -m scripts.pam_handoff HANDOFF_STATE.json
